schemaVersion: 1
updatedAt: 2026-08-05
policyVersion: data-source-adoption-v1

# 原則:
# - 無料であることは採用理由にならない。
# - SNS・技術記事・GitHubは新しいAPI/OSSを発見する入口に限る。
# - 投資上の事実は一次情報へ照合し、一般SNS投稿を証拠・スコア・BUY判定へ使わない。
# - 公式SNSは、企業・官公庁の公式Webサイトから当該アカウントURLへの逆向きリンクを確認できた場合のみ verified とする。
# - core_now でも全件クロールを意味しない。Edgeに必要な最小範囲だけ利用する。

sources:
  - id: jquants-free
    name: J-Quants API Free
    operator: Japan Exchange Group
    officialUrl: https://jpx-jquants.com/
    verifiedAt: 2026-08-05
    sourceClass: licensed_market_data
    roles: [market_reaction, confounder]
    adoption: core_now
    roadmapPhase: P2
    auth:
      mode: api_key
      secretRequired: true
      notes: 既存クライアントあり。秘密値はローカル環境のみ。
    cost:
      freeStatus: free_limited
      limits: 履歴と鮮度に無料プラン制約がある。遅延値を現在値として表示しない。
      upgradeTrigger: PIT Price Store完成後、10年検証を一括実行できる準備が整った月にStandardを1か月試す。
    temporal:
      freshness: 遅延あり
      history: 無料範囲のみ
      publicationTimestamp: date_only
    pit:
      support: partial
      revisionHandling: provider取得時刻、データ基準日、調整前後、corporate actionを別保存する。
      requiredTimestamps: [observedAt, retrievedAt, firstExecutableAt]
    rights:
      rawStorage: local_only
      gitCommit: metadata_only
      publicDisplay: derived_only
      redistribution: prohibited
      notes: 契約・利用規約を優先し、生データや継続的な市場データを公開サイトへ載せない。
    reliability:
      authority: official
      operationalRisk: low
      fallback: 欠損時はデータギャップとして停止し、非公式価格へ自動フォールバックしない。
    integration:
      existingState: partial
      maintenanceCost: medium
      failureIsolation: required
      entityKeys: [security_code, trading_date]
      notes: 84日遅延制御と日足・財務サマリー実装あり。正式PIT provider化が未完。
    edgeUseCases: [known-bad-event-repricing, executable-event-study, benchmark-adjustment]
    blockers: [PIT Price Store契約未完成, TOPIX・業種benchmarkの正式保存未完成]
    nextAction: P2で既存実装を正式providerへ昇格し、遅延・権利・revisionを明示する。

  - id: jquants-standard
