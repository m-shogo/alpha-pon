schemaVersion: 1
updatedAt: "2026-08-27"
policy:
  mergeWhen:
    - same issuer/event population
    - same causal mechanism
    - same PIT information timeline
    - same primary outcome and counterfactual
  keepSeparateWhen:
    - causal mechanism differs materially
    - entry information set differs materially
    - primary outcome or counterfactual differs materially
    - combining would hide a falsifiable hypothesis
  rule: "Do not promote a note to a first-class Edge merely because its filename contains edge. Prefer parent Edge + sub-signal/filter/stage when the underlying hypothesis is shared."

