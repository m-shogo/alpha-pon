summary: >-
  Study Starlink as a broad connectivity shock rather than a telecom-stock proxy. As Direct-to-Cell, IoT, business, maritime, aviation and other satellite connectivity reduce the cost and friction of staying connected outside terrestrial coverage, map both sides of the value transfer: products, services and industries whose demand becomes newly viable or expands; upstream and downstream capacity that gains value; and legacy connectivity, safety, monitoring or infrastructure solutions whose demand may be substituted or structurally reduced. Extend the map to indirect second- and third-order Japanese listed-company exposure, but require a measurable causal transmission path and primary evidence before creating a company hypothesis or Formal Edge. Separate headline adoption from realized revenue, margin, churn, capex and other economic effects.
