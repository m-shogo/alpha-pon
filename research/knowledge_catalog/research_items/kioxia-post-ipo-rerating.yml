summary: >-
  Preserve the existing Kioxia retrospective-learning idea without declaring a formal Edge. The observed post-listing rerating may reflect several overlapping mechanisms already tracked elsewhere: IPO supply-demand, lock-up or shareholder overhang, PE/carve-out structure, NAND and storage cycle recovery, and AI-infrastructure demand. The dominant cause, repeatability outside this issuer, and executable timing remain unresolved.
