schemaVersion: 1
id: misconduct-overreaction-recovery
title: Misconduct Overreaction Recovery Edge
status: research
priority: A
owner: chatgpt-hourly
createdAt: "2026-08-27"
lastUpdate: "2026-08-27"
hypothesis: "日本の上場企業で不祥事・ガバナンス事件の初期株価下落が大きい一方、PIT時点で会計・利益・財務への実害が限定的で、問題人物・問題部門・原因を企業価値から切り離せると確認できる場合、その初期下落の一部は過剰反応となり、中期にbenchmark-adjustedで平均回帰する。"
mechanism: >-
  不祥事発覚直後は、将来損失の不確実性、ブランド毀損懸念、ガバナンス不信、機関投資家の機械的売却、信用買い解消、ニュース見出しへの過剰反応が同時に起こり得る。一方で、事件の経済的実害が限定的で、会計訂正・大規模訴訟・規制停止・事業継続毀損へ波及せず、責任主体を会社から切り離せる場合、初期価格反応が長期キャッシュフロー毀損を過大評価している可能性がある。単なる逆張りではなく、実害、切り離し可能性、再発リスク、remediation、同時悪材料、市場要因を分解して回復余地を検証する。
confidence: 0.2
requiredData:
  - 不祥事・事故・ガバナンス事件の初回publicObservedAtと一次情報
  - 会社確認、第三者委員会、監査、規制、訴訟等の時系列
  - 正式イベントの日付・開始時刻・資料公開時刻と、その時点で新たに判明した事実/既知事実の差分
  - 事件前終値、初回反応のfirst executable price、D0 OHLCV、可能なら分足
  - D+1・D+3・D+5・D+10・D+20・D+60・D+120の価格
  - 正式イベント後first executable priceからD+1・D+3・D+5までの価格
  - TOPIX、業種benchmark、matched controlのPIT価格系列
  - 会計訂正額、利益影響、CF影響、罰金・訴訟・補償の既知額とレンジ
  - 経営者・問題人物・子会社・部門の責任範囲と切り離し可能性
  - ブランド・顧客離反・規制・ライセンス・販売停止等の事業影響
  - remediation内容、役員辞任・解任、再発防止策、監査/内部統制状態
  - 信用残、出来高shock、空売り、流動性、spread proxy
  - 正式イベント後のshort diagnosticを評価する場合の貸株可否・逆日歩・borrow cost
  - 同日決算・下方修正・増資・M&A・指数・macro等のconfounder
entry:
  trigger: "初期ショック後、PIT confounder scanで支配的な新規悪材料がなく、実害・会計影響・規制/訴訟・切り離し可能性を最低限分類でき、初期benchmark-adjusted drawdownが研究sampleで事前登録した閾値を超えた最初の執行可能時点"
  side: long
  decisionLagMinutes: 60
exit:
  rule: "事件前終値回復をイベントとして記録し、D+5・D+20・D+60・D+120を独立計測する。主検証の最大保有期間は120営業日。正式イベント後の二次リプライシングは別diagnostic routeとしてD+1・D+3・D+5を記録する。"
  holdingPeriodDays: 120
  invalidation: "会計不正の拡大、支配的な追加悪材料、重大な規制/訴訟リスク、事業停止、継続企業疑義、重大な資金調達懸念、切り離し不能、PIT不明、実価格/benchmark不明、またはfirst executable price不明"
execution:
  feasibility: unknown
  notes: "初期gapを後知恵で最安値約定したことにしない。next open、open+60m、D0 close、確認イベント後first executableを別routeで比較する。正式イベント後のshort routeは独立BUY/SELL signalではなく、long entryの待機・timing・false-bargain判定用diagnosticとして扱い、short実行可能性を論じる場合だけborrow/spreadを控除する。"
  borrowAvailability: unknown
voiInputs:
  expectedNetAlphaBps: 0
  uncertaintyReduction: 0.95
  executionImprovement: 0.65
  researchCost: 0.75
  notes: "旧idiosyncratic-shock研究とKnown-Bad Event Repricing研究に候補知見があるが、現Research OSでの正式sample/outcomeは未接続。重複を避けるため2026-08-27にKnown-Badのformal-event repricing routeを本Edgeへ統合した。実測前のため期待Net Alphaは0 bpsで仮置き。"
samples:
  required: 120
  current: 0
  requiredAnalogs: 30
promotionGate:
  sufficientSamples:
    state: unknown
    evidence: "現Research OSへ登録済みの正式実サンプルは0件。成功・非回復・悪化例を同一基準で120件以上必要。formal-event secondary repricingも同一incident timeline内で記録する。"
  holdoutPass:
    state: unknown
    evidence: "探索期間、confirmatory期間、untouched issuer-level holdoutを事前固定していない。"
  pitSafe:
    state: unknown
    evidence: "事件情報、正式イベント情報、実害判定、first executable price、当時の悪材料状態をPITで再現した正式sampleがない。"
  netAlphaPositive:
    state: unknown
    evidence: "benchmark、spread/slippage、税・手数料等を控除したNet Alpha実測は0件。"
  executionFeasible:
    state: unknown
    evidence: "gap、ストップ安、売買停止、流動性、実際のentry timingを正式検証していない。"
  liquiditySufficient:
    state: unknown
    evidence: "ADTV、spread proxy、出来高shock、参加率制約の実測が未実施。"
  borrowCostCovered:
    state: unknown
    evidence: "primaryはlong Edgeのためborrowは主制約ではない。formal-event short diagnosticを収益化可能性まで評価する場合のみ貸株・逆日歩・borrow costを必須とする。"
  confoundersRemoved:
    state: unknown
    evidence: "決算、業績修正、資本政策、指数、macro、同時訴訟/規制等のPIT confounder ledgerが未構築。"
  counterfactualExplained:
    state: unknown
    evidence: "matched drawdown、generic reversal、外部事件venue control、同業不祥事controlとの比較が未実施。"
  decayChecked:
    state: unknown
    evidence: "historicalとrecentでEdgeが維持されるか未検証。"
  falseDiscoveryGuard:
    state: unknown
    evidence: "旧研究27候補と旧Known-Bad設計は探索知識として扱い、閾値決定とconfirmatory/holdoutを分離する必要がある。"
decay:
  reviewIntervalDays: 30
  notes: "SNS/高速ニュース・機関投資家ルール・開示速度の変化で初期過剰反応、正式イベント時の二次下落、回復速度は変化し得るためrecent/historicalを分離する。"
notes: |-
  purpose:
    - 不祥事株が下がったから買うEdgeではない
    - 企業価値への実害より株価下落が大きいケースを探す
    - 1つの事件を初期shock -> 正式イベント -> remediation -> 回復/非回復まで一本のtimelineで研究する
    - 戻るケースと戻らないケースの違いを学習し、最終的にBUY/WATCH/WAIT/AVOID候補の根拠へ使う

  researchRoutes:
    initialShockRecovery:
      role: primary
      side: long
      question: 初期不祥事shockが企業価値毀損に比べて過剰なら、その後に平均回帰するか
      horizons: D+5, D+20, D+60, D+120
    knownBadSecondaryRepricing:
      role: diagnostic
      formerEdgeId: known-bad-event-repricing
      question: 悪材料が既知のまま株主総会・会見・第三者委員会報告・行政処分・判決等の正式イベントを迎え、新規支配的悪材料がなくても解決期待の剥落で追加下落するか
      horizons: event first executable, D+1, D+3, D+5
      use: long entryの待機条件、買い急ぎ回避、false bargain判定、最適entry timingの説明変数
      rule: 同一incidentを別Edge sampleとして二重カウントしない
    remediationFollowThrough:
      role: risk-control linkage
      question: 改善策がpolicy-onlyで終わらず、統制・システム・監査証拠として持続するか

  coreDimensions:
    - economicDamage: 売上、利益、CF、資産、罰金、補償、訴訟の実害
    - accountingImpact: 訂正決算、虚偽記載、監査意見、内部統制
    - actorSeparability: 問題人物・部門・子会社を切り離せるか
    - managementDependence: 創業者/CEO/主要人物への事業依存
    - regulatoryLitigation: 規制、許認可、行政処分、訴訟の継続性
    - brandDamage: 顧客離反、スポンサー離脱、取引停止、SNS炎上の実売上波及
    - recurrenceRisk: 同種問題の再発、構造的原因、過去remediation失敗
    - remediationQuality: 辞任だけでなく、権限・統制・システム・監査証拠まで改善したか
    - balanceSheetResilience: 損失を吸収できる財務余力
    - marketOverreaction: benchmark/sector補正後の初期drawdown

  informationState:
    - fact: 一次資料で確認済み
    - knownFact: entry時点ですでに市場が知り得た事実
    - assumption: 未確認だが分析上置いた仮定
    - opinion: 評価・解釈
    - postEntryReveal: entry後に初めて公表された追加悪材料は別管理し、entry時点判定へ後知恵で混ぜない

  incidentClasses:
    - executive_personal_misconduct
    - employee_misconduct
    - accounting_fraud
    - governance_control_failure
    - product_safety
    - data_breach
    - regulatory_violation
    - litigation
    - brand_scandal
    - subsidiary_localized_issue
    - external_incident_venue_only

  separabilityClasses:
    - high: 問題主体の除去で主要事業・会計・許認可への波及が限定的
    - medium: 部分的に切り離せるがブランド/取引/統制への波及が残る
    - low: 経営中枢、会計、主力製品、許認可、支配株主構造に直結
    - unknown: 判断材料不足のためABSTAIN

  recoveryMetrics:
    - eventDrawdownBps: event前基準価格からentryまでの下落
    - abnormalDrawdownBps: TOPIX/業種/matched move控除後の下落
    - timeToPreEventClose: 事件前終値を初めて回復する営業日数
    - reclaimByD20/D60/D120
    - overshootBps: 事件前終値を超えた最大幅
    - maxAdverseExcursion
    - maxFavorableExcursion
    - D+5/D+20/D+60/D+120 benchmark-adjusted return
    - permanentImpairment: D+120でも回復せずfundamental deteriorationで説明されるか

  secondaryRepricingMetrics:
    - formalEventPublicObservedAt
    - formalEventFirstExecutableAt
    - newFactsVsKnownFacts
    - eventToD1/D3/D5 benchmark-adjusted return
    - eventDayGapAndCloseReturn
    - resolutionExpectationFailure: 新規悪材料なしでもイベント前期待が剥落した可能性をPIT evidenceで記述
    - entryTimingImpact: 初期shock直後に買う場合と正式イベント通過後に買う場合のMAE/Net Alpha差

  candidateThresholdsForExplorationOnly:
    - abnormalDrawdownBps >= 500
    - abnormalDrawdownBps >= 1000
    - abnormalDrawdownBps >= 1500
    - abnormalDrawdownBps >= 2000
    - 閾値は探索sample内だけで評価しconfirmatory/holdoutへ固定する

  likelyPositivePatternCandidates:
    - 問題人物の迅速な辞任/解任と権限遮断
    - 過年度会計・連結利益への重大影響なし
    - 罰金/補償額が企業規模に対して吸収可能
    - 主力商品/許認可/販売チャネルへの停止影響なし
    - 問題が局所子会社/個人に限定される
    - 会社が一次情報を迅速・具体的に開示
    - 再発防止がpolicy-onlyでなくsystem/workflow/evidence-producing controlsまで含む
    - 事件後も会社予想・需要・受注・客数等の事業KPIが維持

  likelyFalseBargainCandidates:
    - 粉飾/会計不正が連結財務へ拡大
    - 監査意見、内部統制、上場維持へ波及
    - CEO/創業者本人がIP、営業、資金調達、主要顧客の中心
    - 行政処分や許認可停止が主力事業を止める
    - 集団訴訟・補償額の上限が見えない
    - 下方修正や資金調達悪化が同時発生
    - 同種不祥事が再発しremediation credibilityが低い
    - ブランド毀損がPOS/客数/解約率等の実データへ波及

  negativeControls:
    - 外部犯罪・災害の舞台になっただけで会社内部に原因がない事件
    - 同日に同程度下落した非不祥事matched stocks
    - generic high-volatility reversal
    - sector-wide shock
    - earnings-miss drawdown

  canonicalization:
    - known-bad-event-repricingは2026-08-27にstandalone Edgeをdeprecatedとし、本EdgeのknownBadSecondaryRepricing routeへ統合した
    - 旧Known-Badのimmutable id/hypothesis/createdAtはprovenanceとして残す
    - 旧Known-Badは正式sample 0件だったためsample/outcomeの二重移行は発生しない
    - 今後は1つのincidentに対し初期shockとformal-event secondary repricingを同じcase timelineへ記録する

  relationshipToOtherEdges:
    - remediation-half-life: 不祥事後の改善が長期に維持されるかを見るrisk-control Edge。必要な証拠は本EdgeのremediationFollowThroughへ参照するが独立した耐久性研究は維持する
    - ex-rights-overreaction-recovery: 権利落ち需給による過剰下落を扱う別のmean-reversion family
    - external-incident-venue-negative-control: 会社内部責任のない外部事件をnegative controlとして利用する

  initialSeedCases:
    - Sanrio: 個人/ガバナンス問題、会計・事業への実害、人物切り離し、正式イベント時の二次リプライシング、株価回復を同一timelineで再検証するseed候補。正式sample化は一次資料/PIT価格確認後のみ
