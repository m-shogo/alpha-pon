# alpha-pon 監視対象ユニバース
# 目的: watchlist.yml に未登録の銘柄を自動スクリーニングして「監視候補」を発掘する。
# 注意: このリスト自体は買い推奨ではない。調査・検証・反省用。
# 更新: 世界情勢や投資テーマの変化に合わせて適宜見直す。

