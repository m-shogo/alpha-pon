version: 1
description: "大型IPO/AI/宇宙テーマを、監視・証拠確認・待つ理由として扱うためのルール。売買推奨ではない。"
defaultAction: "監視・証拠確認・待つ理由の記録"
neverTreatAs:
  - "売買推奨"
  - "上場直後の即断"
  - "テーマ名だけの評価"
  - "SNSや報道見出しだけの判断"
globalReferenceEvents:
  - "SpaceX / Starlink 上場観測"
  - "OpenAI 上場準備観測"
  - "Anthropic 上場観測"
  - "AIデータセンター投資"
  - "NAND / SSD / eSSD需要"
  - "GPU / HBM偏重によるNAND波及不足"
safetyRules:
  - "報道だけでは調査候補を上げない"
  - "上場週は原則観察のみ"
  - "初回決算前は数字未確認として扱う"
  - "ロックアップ解除前後は需給確認を優先する"
  - "関連日本株は本命/周辺/織り込み済みに分ける"
  - "調査候補は買い指示ではない"
phases:
  - id: "pre_ipo"
    label: "上場前報道"
    defaultAction: "一次情報待ち"
    focus:
      - "S-1 / 届出書 / 公式発表の有無"
      - "報道元と会社公式情報の差"
      - "既存上場関連銘柄への過熱波及"
    touchAvoidReasons:
      - "未上場企業の条件が未確定"
      - "関連株は期待先行になりやすい"
  - id: "ipo_week"
    label: "上場週"
    defaultAction: "初値・出来高・ロックアップ条件の観察"
    focus:
      - "公開価格と初値の乖離"
      - "出来高急増と短期資金集中"
      - "ベンチマーク比の過熱"
    touchAvoidReasons:
      - "価格発見が終わっていない"
      - "短期資金で振れやすい"
  - id: "first_earnings"
    label: "上場後初回決算"
    defaultAction: "売上化と利益率を確認"
    focus:
      - "売上成長と営業利益率"
      - "顧客集中・設備投資・在庫"
      - "会社予想と市場期待の差"
    touchAvoidReasons:
      - "物語と実績の差が出やすい"
  - id: "lockup_expiry"
    label: "ロックアップ解除"
    defaultAction: "需給イベントとして監視"
    focus:
      - "解除日"
      - "既存株主の保有比率"
      - "売り圧力と出来高"
    touchAvoidReasons:
      - "事業価値と需給イベントを混同しやすい"
  - id: "post_hype_drawdown"
    label: "過熱後の調整"
    defaultAction: "押し目か仮説崩れかを分ける"
    focus:
      - "20日/60日騰落率"
      - "TOPIX比"
      - "出来高沈静化"
      - "材料出尽くしの有無"
    touchAvoidReasons:
      - "下落が押し目ではなく仮説崩れの可能性"
  - id: "fundamental_confirmation"
    label: "実需確認"
    defaultAction: "収益・受注・市況への接続を確認"
    focus:
      - "受注残"
      - "粗利率"
      - "設備投資計画"
      - "顧客CAPEX"
      - "市況価格"
    touchAvoidReasons:
      - "テーマだけで売上・利益に接続していない可能性"
themes:
  - id: "ai_frontier_ipo"
    label: "AI大型上場監視"
    names:
      - "OpenAI"
      - "Anthropic"
    defaultAction: "公式届出・資金吸収・関連株過熱を監視"
    watchEvidence:
      - "S-1 / 公式IR / 主要投資家情報"
      - "AIインフラ設備投資"
      - "GPU/ASIC/HBM/NAND/SSD需要への接続"
      - "赤字幅・粗利率・顧客集中"
    japaneseSpilloverThemes:
      - "memory_storage"
      - "semiconductor_equipment"
      - "power_grid"
      - "optical_network"
      - "datacenter"
    relatedCompanies:
      - code: "285A"
        name: "キオクシアホールディングス"
        relation: "NAND / SSD / eSSD / AI推論ストレージ"
      - code: "8035"
        name: "東京エレクトロン"
        relation: "半導体製造装置"
      - code: "6857"
        name: "アドバンテスト"
        relation: "半導体検査"
      - code: "5803"
        name: "フジクラ"
        relation: "光通信・データセンター配線"
      - code: "5802"
        name: "住友電気工業"
        relation: "光通信・電線・電力網"
      - code: "6501"
        name: "日立製作所"
        relation: "AIインフラ・社会インフラ周辺"
  - id: "space_connectivity_ipo"
    label: "宇宙・衛星通信上場監視"
    names:
      - "SpaceX"
      - "Starlink"
    defaultAction: "上場条件・衛星通信契約・防衛/通信波及を監視"
    watchEvidence:
      - "公式上場手続き"
      - "打上げ/衛星数/通信契約"
      - "防衛・災害通信・海上/航空通信の契約"
      - "競合衛星通信と規制"
    japaneseSpilloverThemes:
      - "space_defense"
      - "satellite_connectivity"
      - "disaster_resilience"
      - "communication_infrastructure"
    relatedCompanies:
      - code: "7011"
        name: "三菱重工業"
        relation: "宇宙・防衛・打上げ関連"
      - code: "9348"
        name: "ispace"
        relation: "宇宙テーマ上場企業"
      - code: "5803"
        name: "フジクラ"
        relation: "通信インフラ"
      - code: "5802"
        name: "住友電気工業"
        relation: "通信・電力インフラ"
  - id: "memory_storage_cycle"
    label: "AIストレージ・メモリ市況"
    names:
      - "NAND"
      - "SSD"
      - "eSSD"
      - "AI inference storage"
    defaultAction: "市況・受注・価格転嫁を確認"
    watchEvidence:
      - "NAND価格"
      - "eSSD需要"
      - "AI推論向けストレージ投資"
      - "在庫水準"
      - "設備投資負担"
    japaneseSpilloverThemes:
      - "memory_storage"
      - "semiconductor_materials"
      - "datacenter"
    relatedCompanies:
      - code: "285A"
        name: "キオクシアホールディングス"
        relation: "NAND / SSD / eSSD"
      - code: "8035"
        name: "東京エレクトロン"
        relation: "半導体製造装置"
      - code: "6857"
        name: "アドバンテスト"
        relation: "検査装置"
outcomeStats:
  minSampleSize: 5
  horizons:
    - "1w"
    - "1m"
  groupBy:
    - "themeId"
    - "phase"
    - "relatedCompanyCode"
