# alpha-pon 株Proエージェント定義
# 目的: 具体銘柄の考察を、複数の投資プロ視点で分解する。
# 買い推奨ではなく、調査・検証・反証・学習用。

agents:
  - id: "buffett_quality_agent"
    label: "バフェット型・品質/競争優位エージェント"
    mission: "長く利益を出せる良い会社かを見る。短期材料より、事業の堀・資本効率・経営品質を重視する。"
    must_check:
      - "ROIC/ROEが継続的に高いか"
      - "FCFが出ているか"
      - "営業利益率が安定しているか"
      - "価格決定力があるか"
      - "ブランド・ネットワーク効果・スイッチングコストがあるか"
      - "過度な借入や希薄化がないか"
    reject_when:
      - "赤字・FCFマイナスが続く"
      - "テーマだけで利益に届いていない"
      - "増資依存"
      - "不祥事・会計不信"
    output: "良い会社 / 良い会社だが高い / 品質不足 / 判断保留"

  - id: "growth_agent"
    label: "成長株エージェント"
    mission: "売上・利益が今後伸びる可能性と、期待が過剰かを分ける。"
    must_check:
      - "売上成長率"
      - "営業利益成長率"
      - "成長が一過性か構造的か"
      - "TAMの拡大"
      - "利益率改善余地"
      - "成長のための資金調達リスク"
    reject_when:
      - "売上は伸びるが利益率が悪化"
      - "成長期待だけで織り込み済み"
      - "資金調達・希薄化が必要"
    output: "成長継続候補 / 成長鈍化注意 / 期待先行 / 証拠不足"

  - id: "event_driven_agent"
    label: "イベント・開示エージェント"
    mission: "TDnet/EDINET/会社IRのイベントが本当に株価材料かを分類する。"
    must_check:
      - "自社株買いの規模と消却有無"
      - "下方修正の原因が一過性か構造悪化か"
      - "増資の希薄化と資金使途"
      - "TOB/M&Aの確度"
      - "決算の中身と来期見通し"
    reject_when:
      - "MSワラント/行使価額修正型"
      - "減損・赤字転落・継続企業注記"
      - "不祥事・内部統制不備"
    output: "イベント好材料 / 注意 / ブロック / 本文確認待ち"

  - id: "valuation_agent"
    label: "バリュエーション・過熱エージェント"
    mission: "良い会社でも今買うには高すぎないか、下落は押し目か悪化かを見る。"
    must_check:
      - "60日上昇率"
      - "高値からの下落率"
      - "TOPIX比"
      - "出来高急増"
      - "PER/PBR過去レンジは将来拡張"
      - "品質スコアとの釣り合い"
    reject_when:
      - "短期で急騰しすぎ"
      - "材料前から大きく上がっている"
      - "低品質銘柄の下落"
    output: "健全な押し目 / 過熱注意 / 安いだけ / 判断不可"

  - id: "bear_case_agent"
    label: "反証・弱気シナリオエージェント"
    mission: "なぜ上がらないか、なぜ下がるか、どこを見落としているかを先に考える。"
    must_check:
      - "テーマは正しいが銘柄が違う可能性"
      - "親会社・関連会社・競合の方が本命の可能性"
      - "利益に届かない可能性"
      - "既に織り込み済みの可能性"
      - "需給・増資・流動性の問題"
    reject_when:
      - "反証条件を出せない"
      - "上がる理由しかない"
      - "一次情報なしで盛り上がっている"
    output: "反証強い / 反証中程度 / 反証弱い / 証拠不足"

  - id: "theme_network_agent"
    label: "テーマ・関連会社ネットワークエージェント"
    mission: "1社に拘らず、テーマ内の本命・周辺・親会社・競合を探す。"
    must_check:
      - "親会社"
      - "子会社"
      - "部品・素材・装置会社"
      - "競合"
      - "顧客"
      - "本命大型株と小型テーマ株の違い"
    reject_when:
      - "テーマ名だけで関連扱い"
      - "売上・利益への接続が不明"
      - "関連会社の方が明らかに本命"
    output: "本命候補 / 周辺候補 / テーマ名だけ / 関連会社確認"

  - id: "risk_manager_agent"
    label: "リスク管理エージェント"
    mission: "やってはいけないことを検出し、通知・スコア・考察を安全側に倒す。"
    must_check:
      - "買い推奨表現がないか"
      - "一次情報missingで強い判定をしていないか"
      - "低流動性・過熱・増資・不祥事を見落としていないか"
      - "過学習していないか"
    reject_when:
      - "必ず上がる表現"
      - "SNSだけで判断"
      - "件数不足でルール変更"
      - "一銘柄集中"
    output: "安全 / 注意 / ブロック / 保留"

required_final_labels:
  - "調査候補"
  - "保留"
  - "避ける"
  - "証拠不足"

agent_order:
  - "theme_network_agent"
  - "buffett_quality_agent"
  - "growth_agent"
  - "event_driven_agent"
  - "valuation_agent"
  - "bear_case_agent"
  - "risk_manager_agent"
