version: 1
description: "特殊状況・時間差再評価ウォッチ。carve-out / PE出口 / spin-off / lockup / cycle recovery 等の王道パターンを、調査優先候補・監視候補として蓄積する。売買推奨ではない。"
defaultAction: "特殊状況の有無と段階を分けて、証拠が揃うまで待つ理由を明確にする"
neverTreatAs:
  - "売買推奨"
  - "安いから買う判断"
  - "テーマ名だけの評価"
  - "上場直後の即断"
  - "SNS/見出しだけの判断"
safetyRules:
  - "単価が安い = 割安ではない"
  - "報道だけでは強い通知に上げない"
  - "上場週・ロックアップ前後は需給イベントとして観察"
  - "公式情報か報道か噂かを必ず分ける"
  - "sampleTooSmall は強い判断の根拠にしない"

patterns:
  - id: "carve_out_ipo"
    label: "カーブアウトIPO"
    description: "大企業や親会社から重要事業が切り出されて上場する型。例: キオクシアのような大企業由来の重要事業。"
    whyInteresting:
      - "親会社時代より自由度が高くなる可能性"
      - "重要事業のため資本市場の注目を集めやすい"
      - "PMI後の単独評価で再評価余地"
    whyDangerous:
      - "親会社依存・販売チャネル依存が残る場合"
      - "上場時に既存株主の出口売りが重なる"
      - "切り出し直後はガバナンス整備が未完"
    evidenceNeeded:
      - "親会社/旧親会社の持分推移"
      - "切り出された理由(戦略的・財務的)"
      - "事業の重要性(売上構成・顧客)"
      - "親会社との取引依存度"
      - "単独上場後の経営自由度"

  - id: "pe_exit_ipo"
    label: "PE出口IPO"
    description: "PEファンド保有後のIPO。出口売りとロックアップが最大の論点。"
    whyInteresting:
      - "PE保有中に経営改善が進んでいる可能性"
      - "ロックアップ通過後の需給改善余地"
    whyDangerous:
      - "PEによる追加売出しリスク"
      - "高い借入負担(LBO残債)"
      - "短期的なPL最適化で投資不足の可能性"
    evidenceNeeded:
      - "PE/スポンサーの残保有比率"
      - "ロックアップ期間と解除日"
      - "純有利子負債/EBITDA"
      - "追加売出しの公表有無"
      - "経営陣の継続性"

  - id: "spin_off"
    label: "スピンオフ"
    description: "親会社から独立する型。親会社株主の機械的売りと、独立後の単独評価が論点。"
    whyInteresting:
      - "分離後の経営自由度・意思決定速度"
      - "セグメント単独でのバリュエーション再評価"
    whyDangerous:
      - "親会社株主による機械的な売却"
      - "負債を背負わされている可能性"
      - "親会社のリソース喪失"
    evidenceNeeded:
      - "分離後の経営陣構成"
      - "負債/資本構成の引継ぎ"
      - "親会社株主の保有方針"
      - "単独セグメントとしての収益性"

  - id: "post_ipo_lockup_overhang"
    label: "上場後ロックアップ需給待ち"
    description: "上場後のロックアップ解除・売り圧通過を待つ型。需給イベントとして観察。"
    whyInteresting:
      - "売り圧通過後に需給が改善する局面"
      - "初回決算で実需が確認できれば再評価余地"
    whyDangerous:
      - "ロックアップ解除日前後の出来高急増"
      - "大株主による分散売却"
      - "解除と決算が重なる場合の二重ダウンサイド"
    evidenceNeeded:
      - "上場日"
      - "ロックアップ解除日と対象株数"
      - "大株主の売却計画"
      - "出来高推移"
      - "初回決算日"

  - id: "major_holder_exit_overhang"
    label: "大株主出口需給待ち"
    description: "親会社・政府・PE・創業家などの大量売却による売り圧通過型。"
    whyInteresting:
      - "売り圧通過後の浮動株増加で需給改善"
      - "完全独立化による意思決定の自由度向上"
    whyDangerous:
      - "売却ペース不透明"
      - "売却理由が会社のネガティブ情報を反映する可能性"
    evidenceNeeded:
      - "誰が売っているか"
      - "売却理由(資金調達/戦略変更/出口)"
      - "売却後の浮動株比率"
      - "売り圧通過の需給シグナル"

  - id: "cycle_recovery"
    label: "市況サイクル回復"
    description: "メモリ・半導体・素材・海運・化学等の市況サイクル回復型。"
    whyInteresting:
      - "市況底打ち・反転の兆候"
      - "在庫調整完了後の出荷増"
      - "価格転嫁による利益率改善"
    whyDangerous:
      - "市況の二番底"
      - "在庫水準の高止まり"
      - "設備投資負担による FCF 悪化"
    evidenceNeeded:
      - "市況価格(NAND/DRAM/運賃 等)"
      - "在庫水準"
      - "受注残"
      - "粗利率・営業利益率"
      - "FCF と設備投資計画"

  - id: "parent_subsidiary_reorg"
    label: "親子上場再編・TOB候補"
    description: "親子上場解消・完全子会社化候補。TOB期待だけで過熱していないかが論点。"
    whyInteresting:
      - "親子上場解消トレンド"
      - "PBR改善・ガバナンス改革の流れ"
    whyDangerous:
      - "TOB期待だけの過熱"
      - "完全子会社化が見送られた場合の反落"
      - "親会社の方針転換"
    evidenceNeeded:
      - "親会社の持分比率"
      - "親会社の中期経営計画・親子上場方針"
      - "PBR/ROE と東証要請の進捗"
      - "ガバナンス改革の具体策"

  - id: "government_privatization_ipo"
    label: "政府・自治体保有の民営化IPO"
    description: "政府・自治体保有株の民営化IPO。例: 東京メトロ。"
    whyInteresting:
      - "安定した事業基盤"
      - "配当性向の明示化"
      - "民営化後の経営自由度"
    whyDangerous:
      - "規制リスク"
      - "残持分の段階的売却による需給圧迫"
      - "成長性に限定"
      - "初値が過熱しやすい"
    evidenceNeeded:
      - "政府/自治体の残持分"
      - "配当方針"
      - "規制環境"
      - "成長余地と安定性のバランス"
      - "初値と公開価格の乖離"

  - id: "small_ticket_overlay"
    label: "少額投資オーバーレイ(補助条件)"
    description: "少額で監視しやすい補助条件。単独パターンではなく、上記特殊状況に当てはまる銘柄が少額で見やすい場合だけ付ける。安いから買うは禁止。"
    whyInteresting:
      - "監視・分散・段階的な確認がしやすい"
    whyDangerous:
      - "単価の低さを割安と誤認するリスク"
      - "流動性が低い場合のスリッページ"
    evidenceNeeded:
      - "最低売買金額"
      - "1日平均出来高"
      - "上記特殊状況パターンとの組合せ"

