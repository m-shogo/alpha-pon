name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/run-daily.sh scripts/ci-pipeline-smoke.sh scripts/run-proposal-history.sh scripts/run-daily-complete.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm ci:smoke
      - run: bash scripts/ci-pipeline-smoke.sh
      - run: bash scripts/run-proposal-history.sh
      - run: node --import tsx/esm src/persona-audit.ts
      - run: node --import tsx/esm src/valuation-range.ts
      - run: node --import tsx/esm src/primary-disclosure-subtypes.ts
      - run: node --import tsx/esm src/regime-scenario-report.ts
      - run: node --import tsx/esm src/stock-pro-agent-report.ts
      - run: node --import tsx/esm src/stock-pro-summary.ts
      - run: node --import tsx/esm src/company-hypothesis-report.ts
      - run: node --import tsx/esm src/company-network-report.ts
      - run: node --import tsx/esm src/company-coverage-audit.ts
      - run: node --import tsx/esm src/regime-hypothesis-alignment.ts
      - run: node --import tsx/esm src/stale-hypothesis-report.ts
      - run: node --import tsx/esm src/pipeline-health-summary.ts
      - run: node --import tsx/esm src/pipeline-health-alert.ts --dry-run
      - run: node --import tsx/esm src/register-company-context.ts --sample=sanrio
      - run: node --import tsx/esm src/strategic-advice-report.ts
      - run: node --import tsx/esm src/regime-history.ts
      - run: node --import tsx/esm src/source-health-history.ts
      - run: node --import tsx/esm src/company-non-move-sync.ts
      - run: node --import tsx/esm src/ci-health-report.ts
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-pon-reports
          path: |
            reports/latest.md
            reports/primary_disclosure_learning_latest.md
            reports/primary_disclosure_category_learning_latest.md
            reports/source_health_latest.md
            reports/proposals_latest.md
            reports/proposals_latest.json
            reports/proposal_streaks_latest.json
            reports/persona_audit_latest.md
            reports/valuation_range_latest.md
            reports/primary_disclosure_subtypes_latest.md
            reports/primary_disclosure_subtypes_latest.json
            reports/regime_scenarios_latest.md
            reports/regime_scenarios_latest.json
            reports/stock_pro_agent_latest.md
            reports/stock_pro_summary_latest.md
            reports/company_hypotheses_latest.md
            reports/company_network_latest.md
            reports/company_coverage_audit_latest.md
            reports/regime_hypothesis_alignment_latest.md
            reports/stale_hypotheses_latest.md
            reports/pipeline_health_summary_latest.md
            reports/company_context_registration_preview_latest.md
            reports/strategic_advice_latest.md
            reports/ci_health_latest.md
            reports/ci_health_latest.json
            reports/knowledge_review_weekly_latest.md
            reports/knowledge_review_monthly_latest.md
            reports/knowledge_review_yearly_latest.md
            reports/pipeline_status_latest.json
            reports/scores_*.json
            data/company_context_registry.jsonl
            data/proposals_history.jsonl
            data/regime_history.jsonl
            data/source_health_history.jsonl
            data/company_non_move_history.jsonl
            data/analogy_outcomes.jsonl
          if-no-files-found: ignore
