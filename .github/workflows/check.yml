name: Check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare offline CI environment
        run: test -f .env || touch .env

      - name: Run lightweight draft checks
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: bash scripts/run-draft-checks.sh

      - name: Install shellcheck
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell scripts
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: shellcheck scripts/run-draft-checks.sh scripts/run-daily.sh scripts/ci-pipeline-smoke.sh scripts/run-proposal-history.sh scripts/run-daily-complete.sh scripts/pipeline-lock.sh scripts/verify-cloudflare-production.sh scripts/setup-cloudflare-d1-github-secrets.sh

      - name: Run full core checks
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm check

      - name: Run offline smoke workflow
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm ci:smoke

      - name: Run pipeline smoke scripts
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          bash scripts/ci-pipeline-smoke.sh
          bash scripts/run-proposal-history.sh

      - name: Generate persona and valuation reports
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          node --import tsx/esm src/persona-audit.ts
          node --import tsx/esm src/valuation-range.ts
          node --import tsx/esm src/primary-disclosure-subtypes.ts
          node --import tsx/esm src/regime-scenario-report.ts
          node --import tsx/esm src/pro-knowledge-refresh-report.ts
          node --import tsx/esm src/company-onboarding-audit.ts
          node --import tsx/esm src/stock-pro-quality-audit.ts
          node --import tsx/esm src/stock-pro-improvement-roadmap.ts

      - name: Generate governed stock-pro datasets
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          pnpm pro:quality
          pnpm pro:valuation
          pnpm pro:ir-events
          pnpm pro:committee

      - name: Generate stock-pro and company reports
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          node --import tsx/esm src/stock-pro-agent-report.ts
          node --import tsx/esm src/stock-pro-summary.ts
          node --import tsx/esm src/company-hypothesis-report.ts
          node --import tsx/esm src/company-network-report.ts
          node --import tsx/esm src/company-coverage-audit.ts
          node --import tsx/esm src/regime-hypothesis-alignment.ts
          node --import tsx/esm src/stale-hypothesis-report.ts

      - name: Generate pipeline and strategic reports
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          node --import tsx/esm src/pipeline-health-summary.ts
          node --import tsx/esm src/pipeline-health-alert.ts --dry-run
          node --import tsx/esm src/register-company-context.ts --sample=sanrio
          node --import tsx/esm src/strategic-advice-report.ts
          node --import tsx/esm src/regime-history.ts
          node --import tsx/esm src/source-health-history.ts
          node --import tsx/esm src/company-non-move-sync.ts
          node --import tsx/esm src/ci-health-report.ts

      - name: Upload smoke reports
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: alpha-pon-reports
          retention-days: 7
          path: |
            reports/latest.md
            reports/primary_disclosure_learning_latest.md
            reports/primary_disclosure_category_learning_latest.md
            reports/source_health_latest.md
            reports/proposals_latest.md
            reports/proposals_latest.json
            reports/proposal_streaks_latest.json
            reports/persona_audit_latest.md
            reports/valuation_range_latest.md
            reports/primary_disclosure_subtypes_latest.md
            reports/primary_disclosure_subtypes_latest.json
            reports/regime_scenarios_latest.md
            reports/regime_scenarios_latest.json
            reports/pro_knowledge_refresh_latest.md
            reports/company_onboarding_audit_latest.md
            reports/stock_pro_quality_audit_latest.md
            reports/stock_pro_improvement_roadmap_latest.md
            reports/stock_pro_committee_latest.md
            reports/stock_pro_committee_latest.json
            reports/ipo_theme_watch_latest.md
            reports/ipo_theme_watch_latest.json
            reports/stock_pro_agent_latest.md
            reports/stock-pro-summary_latest.md
            reports/company_hypotheses_latest.md
            reports/company_network_latest.md
            reports/company_coverage_audit_latest.md
            reports/regime_hypothesis_alignment_latest.md
            reports/stale_hypotheses_latest.md
            reports/pipeline_health_summary_latest.md
            reports/company_context_registration_preview_latest.md
            reports/strategic_advice_latest.md
            reports/ci_health_latest.md
            reports/ci_health_latest.json
            reports/knowledge_review_weekly_latest.md
            reports/knowledge_review_monthly_latest.md
            reports/knowledge_review_yearly_latest.md
            reports/pipeline_status_latest.json
            reports/scores_*.json
            apps/web/public/generated/alpha-pon-data.json
            data/buffett_quality_latest.json
            data/valuation_snapshot_latest.json
            data/ir_event_evidence_latest.json
            data/company_context_registry.jsonl
            data/proposals_history.jsonl
            data/regime_history.jsonl
            data/source_health_history.jsonl
            data/company_non_move_history.jsonl
            data/analogy_outcomes.jsonl
          if-no-files-found: ignore
