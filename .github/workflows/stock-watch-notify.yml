name: Alpha Pon Stock Watch Notify

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Stock-watch notification body"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: alpha-pon-stock-watch-notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[STOCK_ALERT]')
    runs-on: ubuntu-latest
    env:
      STOCK_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || github.event.issue.body }}
    steps:
      - name: Open stock-watch bot DM
        id: dm
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          method: conversations.open
          token: ${{ secrets.SLACK_BOT_TOKEN_STOCK_WATCH }}
          payload: |
            users: "U0BSZ2X7BKQ"

      - name: Send Alpha Pon Stock Watch DM
        id: slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN_STOCK_WATCH }}
          payload: |
            channel: ${{ toJSON(steps.dm.outputs.channel_id) }}
            text: ${{ toJSON(env.STOCK_MESSAGE) }}

      - name: Verify Slack accepted delivery
        shell: bash
        env:
          DM_CHANNEL_ID: ${{ steps.dm.outputs.channel_id }}
          SLACK_OK: ${{ steps.slack.outputs.ok }}
          SLACK_TS: ${{ steps.slack.outputs.ts }}
          SLACK_CHANNEL_ID: ${{ steps.slack.outputs.channel_id }}
        run: |
          set -euo pipefail
          test -n "$DM_CHANNEL_ID"
          test "$SLACK_OK" = "true"
          test -n "$SLACK_TS"
          test -n "$SLACK_CHANNEL_ID"
          echo "Alpha Pon Stock Watch delivery accepted: channel=$SLACK_CHANNEL_ID ts=$SLACK_TS"

      - name: Mark issue delivery complete
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          SLACK_CHANNEL_ID: ${{ steps.slack.outputs.channel_id }}
          SLACK_TS: ${{ steps.slack.outputs.ts }}
        with:
          script: |
            const body = `Slack delivery verified. channel=${process.env.SLACK_CHANNEL_ID} ts=${process.env.SLACK_TS}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
