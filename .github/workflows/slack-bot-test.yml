name: Slack Bot Push Test

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Test message sent by the Alpha Pon Stock Watch bot"
        required: false
        default: "🔔 Alpha Pon Stock Watch からのSlack Botプッシュ通知テストです。"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Open bot DM with stock-watch recipient
        id: dm
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          method: conversations.open
          token: ${{ secrets.SLACK_BOT_TOKEN_STOCK_WATCH }}
          payload: |
            users: "U0BSZ2X7BKQ"

      - name: Send stock-watch bot DM to Slack
        id: slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN_STOCK_WATCH }}
          payload: |
            channel: ${{ toJSON(steps.dm.outputs.channel_id) }}
            text: ${{ toJSON(inputs.message) }}

      - name: Verify Slack accepted the message
        shell: bash
        env:
          DM_CHANNEL_ID: ${{ steps.dm.outputs.channel_id }}
          SLACK_OK: ${{ steps.slack.outputs.ok }}
          SLACK_TS: ${{ steps.slack.outputs.ts }}
          SLACK_CHANNEL_ID: ${{ steps.slack.outputs.channel_id }}
        run: |
          set -euo pipefail
          test -n "$DM_CHANNEL_ID"
          test "$SLACK_OK" = "true"
          test -n "$SLACK_TS"
          echo "Slack stock-watch bot delivery accepted: channel=$SLACK_CHANNEL_ID ts=$SLACK_TS"
