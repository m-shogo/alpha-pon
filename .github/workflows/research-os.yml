name: Research OS

# Research OS の整合性チェックと生成物の更新のみを行う。
# このワークフローは研究しない。新しい Edge の作成・投資判断・Production 昇格は一切行わない。
# 判断するのは人間、研究するのは ChatGPT、ここは器の健全性を守るだけ。

on:
  push:
    branches:
      - main
    paths:
      - "research/**"
      - "src/research/**"
      - "tests/research/**"
      - "docs/research/**"
      - "docs/prompts/**"
      - "docs/roadmaps/**"
      - ".github/workflows/research-os.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths:
      - "research/**"
      - "src/research/**"
      - "tests/research/**"
      - "docs/research/**"
      - "docs/prompts/**"
      - "docs/roadmaps/**"
      - ".github/workflows/research-os.yml"
  workflow_dispatch:

concurrency:
  group: research-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research-os:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Append Only / 不変性ガードが履歴を比較するため全履歴が必要
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Draft PRでは型とユニットテストだけを実行する。
      # Ready・main・手動実行では下記のfull validationまで実行する。
      - name: 型チェック
        run: pnpm typecheck && pnpm typecheck:tests

      - name: Research OS ユニットテスト
        run: pnpm research:test

      - name: Schema / 重複 / PIT / Gate / Decay
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm research:validate

      - name: Append Only・不変性ガード
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm research:check:history

      - name: ドキュメント整合性（リンク切れ・生成物の手編集）
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm research:check:docs

      - name: Backtest（fixtures のみ）
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm research:backtest:fixtures

      - name: 生成物が最新か検証
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: pnpm research:generate:check

      # mainへのpushだけが生成物を更新する。手動実行は検証のみでcommitしない。
      - name: 生成物を再生成
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm research:generate

      - name: 生成物の差分をコミット
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain research/)" ]; then
            echo "生成物に差分はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/
          git commit -m "chore(research): 生成物を更新（index / queue / dashboard）"
          git push
