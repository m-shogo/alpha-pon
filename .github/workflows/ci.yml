name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (core CLI)
        run: pnpm check

      - name: Verify market event contracts
        run: node --import tsx/esm scripts/verify-market-event-foundation.ts

      - name: Verify market event SQLite schema
        run: node --import tsx/esm scripts/verify-market-event-schema.ts

      - name: Verify market event end-to-end flow
        run: node --import tsx/esm scripts/verify-market-event-end-to-end.ts

      - name: Generate IPO theme watch
        run: pnpm theme:ipo

      - name: Generate web data
        run: pnpm ui:data

      - name: Typecheck web
        run: pnpm web:typecheck

      - name: Lint web
        run: pnpm --filter @alpha-pon/web lint

      - name: Build web
        run: pnpm web:build
