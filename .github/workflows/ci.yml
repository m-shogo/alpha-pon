name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare offline CI environment
        run: test -f .env || touch .env

      - name: Check core CLI and research contracts
        run: pnpm check

      - name: Build and verify static export
        run: bash scripts/build-cloudflare-pages.sh

      - name: Verify Workers Static Assets routing
        run: node --import tsx/esm scripts/verify-workers-static-assets.ts

      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4.118.0 deploy --dry-run --outdir .wrangler-dry-run
