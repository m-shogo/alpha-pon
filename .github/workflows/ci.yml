name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "research/**"
      - "src/research/**"
      - "tests/research/**"
      - "docs/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "research/**"
      - "src/research/**"
      - "tests/research/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare offline CI environment
        run: test -f .env || touch .env

      - name: Verify Cloudflare D1 sync contracts
        run: node --import tsx/esm scripts/verify-cloudflare-d1-sync.ts

      - name: Verify Cloudflare D1 token provisioning CLI
        run: node --import tsx/esm scripts/verify-cloudflare-d1-token-provisioning.ts

      - name: Verify calendar feed UI boundary
        run: node --import tsx/esm scripts/verify-calendar-feed-ui-contract.ts

      - name: Build and verify Workers Static Assets artifact
        run: bash scripts/build-cloudflare-workers.sh

      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4.118.0 deploy --dry-run --outdir .wrangler-dry-run
