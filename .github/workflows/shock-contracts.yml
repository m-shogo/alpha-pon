name: Shock Contracts

on:
  pull_request:
    paths:
      - "data/idiosyncratic_shock_*.yml"
      - "config/idiosyncratic-shock-*.yml"
      - "src/idiosyncratic-shock-*.ts"
      - "src/backfill-idiosyncratic-shock-outcomes.ts"
      - "tests/idiosyncratic-shock-*.test.ts"
      - "docs/idiosyncratic-shock-*.md"
      - ".github/workflows/shock-contracts.yml"
  workflow_dispatch:

jobs:
  shock-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck core and tests
        run: |
          pnpm typecheck
          pnpm typecheck:tests
      - name: Context envelope contract
        run: node --import tsx/esm tests/idiosyncratic-shock-context-envelope.test.ts
      - name: Context field contract
        run: node --import tsx/esm tests/idiosyncratic-shock-context-validation.test.ts
      - name: PIT evidence contract
        run: node --import tsx/esm tests/idiosyncratic-shock-pit-evidence.test.ts
      - name: Case selection provenance contract
        run: node --import tsx/esm tests/idiosyncratic-shock-case-selection.test.ts
      - name: Threshold eligibility contract
        run: node --import tsx/esm tests/idiosyncratic-shock-threshold-calibration.test.ts
      - name: Threshold diversity contract
        run: node --import tsx/esm tests/idiosyncratic-shock-threshold-diversity.test.ts
      - name: Threshold research priority contract
        run: node --import tsx/esm tests/idiosyncratic-shock-threshold-research-plan.test.ts
      - name: Low-score researched controls
        run: node --import tsx/esm tests/idiosyncratic-shock-low-score-controls.test.ts
      - name: Calibration temporal/prospective separation
        run: node --import tsx/esm tests/idiosyncratic-shock-calibration.test.ts
      - name: Calibration registry prospective contract
        run: node --import tsx/esm tests/idiosyncratic-shock-calibration-config.test.ts
      - name: Prospective outcome isolation
        run: node --import tsx/esm tests/idiosyncratic-shock-prospective-calibration-isolation.test.ts
      - name: Negative-control matching contract
        run: node --import tsx/esm tests/idiosyncratic-shock-negative-control.test.ts
      - name: Research blocker taxonomy contract
        run: node --import tsx/esm tests/idiosyncratic-shock-research-status.test.ts
      - name: Pre-outcome research snapshot contract
        run: node --import tsx/esm tests/idiosyncratic-shock-research-snapshot.test.ts
      - name: Reaction anchor contract
        run: node --import tsx/esm tests/idiosyncratic-shock-reaction-anchor.test.ts
      - name: Backfill plan contract
        run: node --import tsx/esm tests/idiosyncratic-shock-backfill-plan.test.ts
      - name: Outcome production/shadow contract
        run: node --import tsx/esm tests/idiosyncratic-shock-outcomes.test.ts
      - name: Outcome dataset methodology contract
        run: node --import tsx/esm tests/idiosyncratic-shock-outcome-contract.test.ts
      - name: Offline audits
        run: |
          node --import tsx/esm src/idiosyncratic-shock-context-file-audit.ts
          node --import tsx/esm src/idiosyncratic-shock-case-selection-audit.ts
          node --import tsx/esm src/idiosyncratic-shock-threshold-review-queue.ts
          node --import tsx/esm src/idiosyncratic-shock-pit-source-audit.ts
          node --import tsx/esm src/idiosyncratic-shock-threshold-calibration-audit.ts
          node --import tsx/esm src/idiosyncratic-shock-threshold-diversity-audit.ts
          node --import tsx/esm src/idiosyncratic-shock-threshold-research-plan-report.ts
